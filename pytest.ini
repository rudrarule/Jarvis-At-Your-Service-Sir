[pytest]
testpaths = backend
asyncio_mode = auto
norecursedirs = scratch .runtime-site
markers =
    integration: tests that require external services, browsers, or manual verification
addopts =
    --ignore=backend/test_3tier.py
    --ignore=backend/test_fs.py
    --ignore=backend/data
    --ignore=backend/test_browser_manual.py


